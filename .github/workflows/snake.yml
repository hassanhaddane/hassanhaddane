name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%2322D3EE&color_dots=%23E5E7EB,%23A5F3FC,%2367E8F9,%2306B6D4,%230891B2
            dist/snake-dark.svg?color_snake=%23A78BFA&color_dots=%230B1226,%231E3A5F,%231E749A,%2322D3EE,%23818CF8
      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
